    <!-- Suppress benign Vite HMR WebSocket proxy disconnects in preview environment -->
    <!-- Suppress benign Vite HMR WebSocket proxy disconnects in preview environment -->
    <script>
      (function () {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function MockViteWebSocket(url, protocols) {
            var isViteHmr = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1)) isViteHmr = true;

            if (isViteHmr) {
              var emitter = new EventTarget();
              emitter.url = url;
              emitter.readyState = 1; // WebSocket.OPEN
              emitter.OPEN = 1;
              emitter.CONNECTING = 0;
              emitter.CLOSING = 2;
              emitter.CLOSED = 3;
              emitter.send = function () {};
              emitter.close = function () {};
              setTimeout(function () {
                emitter.dispatchEvent(new Event('open'));
              }, 10);
              return emitter;
            }
            return new NativeWebSocket(url, protocols);
          }
          MockViteWebSocket.prototype = NativeWebSocket.prototype;
          MockViteWebSocket.OPEN = NativeWebSocket.OPEN;
          MockViteWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          MockViteWebSocket.CLOSING = NativeWebSocket.CLOSING;
          MockViteWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = MockViteWebSocket;
        }

        function isWsError(msg) {
          if (!msg || typeof msg !== 'string') return false;
          return (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('ws://') !== -1 ||
            msg.indexOf('wss://') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            if (isWsError(e.message) || isWsError(e.filename)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var msg = (e.reason && (e.reason.message || String(e.reason))) || '';
            if (isWsError(msg)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
