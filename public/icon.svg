<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Center Shield / Hexagon -->
  <g transform="translate(256, 210) scale(1.15)">
    <!-- Tech Geometric Hexagon -->
    <path d="M 0 -105 L 90 -52 L 90 52 L 0 105 L -90 52 L -90 -52 Z" fill="#0f172a" stroke="url(#blueGrad)" stroke-width="12" filter="url(#glow)" />
    
    <!-- Pulse Wave / Health & Diagnostics Symbol -->
    <path d="M -65 0 L -35 0 L -15 -45 L 5 45 L 20 -20 L 35 10 L 65 0" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- T20 Bold Wordmark -->
  <text x="256" y="385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    T20
  </text>
  
  <!-- Server Subtext -->
  <text x="256" y="425" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="8">
    ENTERPRISE
  </text>

  <!-- Small Device Compatibility Dots -->
  <circle cx="216" cy="455" r="4" fill="#60a5fa" />
  <circle cx="256" cy="455" r="4" fill="#34d399" />
  <circle cx="296" cy="455" r="4" fill="#fbbf24" />
</svg>
